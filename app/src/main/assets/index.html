<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5ec9a0" />
  <title>轻动 · 健身运动</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 开屏页：薄荷绿主题，居中品牌字 + 副标题，进入主程序时自然过渡 -->
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-bg"></div>
      <div class="splash-leaf" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <defs>
            <linearGradient id="leafG" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#a8eccd"/>
              <stop offset="100%" stop-color="#5ec9a0"/>
            </linearGradient>
          </defs>
          <path d="M32 6 C 18 18, 14 36, 20 52 C 36 46, 50 32, 56 14 C 46 12, 38 10, 32 6 Z" fill="url(#leafG)"/>
          <path d="M22 50 C 30 38, 40 24, 52 16" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
        </svg>
      </div>
      <h1 class="splash-title">轻动</h1>
      <p class="splash-sub">就即刻行动</p>
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>

    <header class="app-header" id="appHeader"></header>
    <main class="app-main">
      <section id="view-home" class="view"></section>
      <section id="view-plans" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-profile" class="view"></section>
    </main>
    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-view="home"><span class="ic">🏠</span><span>运动</span></button>
      <button class="tab" data-view="plans"><span class="ic">📋</span><span>计划</span></button>
      <button class="tab" data-view="stats"><span class="ic">📊</span><span>统计</span></button>
      <button class="tab" data-view="profile"><span class="ic">👤</span><span>我的</span></button>
    </nav>
    <div id="sessionRoot"></div>
    <div id="modalRoot"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
