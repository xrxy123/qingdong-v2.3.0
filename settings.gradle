pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// AGP 版本在此统一声明，供 :app 模块的 `plugins { id 'com.android.application' }` 解析。
plugins {
    id 'com.android.application' version '8.5.2' apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

include ':app'

